[workspace]
resolver = "2"
members = [
    "crates/aatc-engine",
    "crates/aatc-edge",
]

[workspace.package]
version  = "0.1.0"
edition  = "2021"
authors  = ["BAZT-TON Research"]
license  = "MIT"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }

# ONNX inference — ort (official ONNX Runtime, full ML opset incl. TreeEnsembleRegressor)
ort          = { version = "2.0.0-rc.15", features = ["download-binaries"] }

# Serialisation
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# CSV telemetry replay (evaluation / benchmarking)
csv          = "1"

# Logging
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow       = "1"

# CLI
clap         = { version = "4", features = ["derive"] }

# Metrics / benchmarking
criterion    = { version = "0.5", features = ["html_reports"] }
